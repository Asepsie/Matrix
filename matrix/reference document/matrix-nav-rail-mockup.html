<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Matrix — Persistent Nav Rail v2</title>
<style>
  :root{
    --bg:#0d0e10; --rail-bg:#131519; --surface:#181b1f; --surface2:#1f2329; --border:#2c3036;
    --text:#e8eaed; --muted:#8b9096; --dim:#5a5f66;
    --accent:#c8f135; --accent2:#5be5c8;
    --rail:58px; --rail-open:238px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  .app{display:flex; height:100vh; width:100%; position:relative}
  svg{display:block}

  /* ── RAIL ─────────────────────────────────────────── */
  .rail{
    width:var(--rail); flex:none; background:var(--rail-bg);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; transition:width .18s ease; z-index:40;
  }
  .rail.open{width:var(--rail-open)}

  .rail-top{
    height:52px; flex:none; display:flex; align-items:center;
    border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap;
  }
  .pin{
    width:32px;height:32px;flex:none;margin:0 auto;border:1px solid var(--border);
    background:var(--bg);color:var(--muted);border-radius:7px;cursor:pointer;
    display:grid;place-items:center;transition:.12s;
  }
  .rail.open .pin{margin:0 10px 0 13px}
  .pin:hover{border-color:var(--accent);color:var(--accent)}
  .brand{font-size:11px;letter-spacing:.05em;line-height:1.15;opacity:0;transition:opacity .12s;flex:1}
  .rail.open .brand{opacity:1}
  .brand .lime{color:var(--accent)}

  .rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0}
  .rail-scroll::-webkit-scrollbar{width:6px}
  .rail-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .dom{position:relative}
  .dom-head{
    display:flex;align-items:center;gap:13px;height:46px;cursor:pointer;
    padding:0 14px;color:var(--muted);transition:.12s;white-space:nowrap;position:relative;
  }
  .rail:not(.open) .dom-head{padding:0;justify-content:center}
  .dom-head:hover{color:var(--text)}
  .dom.active-dom>.dom-head{color:var(--text)}
  .dom.active-dom>.dom-head::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
    background:var(--accent);border-radius:0 3px 3px 0;
  }
  .dom-ico{
    width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;
    background:var(--surface2);border:1px solid var(--border);color:var(--muted);transition:.12s;
  }
  .dom-head:hover .dom-ico{color:var(--text);border-color:#3a3f46}
  .dom.active-dom .dom-ico{color:var(--accent);border-color:rgba(200,241,53,.4);background:rgba(200,241,53,.08)}
  .dom-name{font-size:12.5px;font-weight:600;letter-spacing:.04em;flex:1;opacity:0;transition:opacity .1s}
  .rail.open .dom-name{opacity:1}
  .dom-chev{flex:none;color:var(--dim);opacity:0;transition:transform .18s,opacity .1s}
  .rail.open .dom-chev{opacity:1}
  .dom.exp .dom-chev{transform:rotate(90deg);color:var(--accent)}

  .subs{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .rail.open .dom.exp .subs{max-height:320px}
  .rail:not(.open) .subs{display:none}
  .sub{
    display:flex;align-items:center;padding:8px 14px 8px 60px;font-size:11.5px;color:var(--muted);
    cursor:pointer;white-space:nowrap;transition:.1s;position:relative;
  }
  .sub:hover{color:var(--text);background:rgba(255,255,255,.03)}
  .sub.active{color:var(--accent)}
  .sub.active::before{content:"";position:absolute;left:42px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .sub .bdg{font-size:8px;color:var(--dim);margin-left:7px;letter-spacing:.04em}

  .rail-foot{border-top:1px solid var(--border);padding:8px 0}
  .util-row{
    display:flex;align-items:center;gap:13px;height:40px;padding:0 14px;
    color:var(--dim);cursor:pointer;transition:.12s;white-space:nowrap;
  }
  .rail:not(.open) .util-row{padding:0;justify-content:center}
  .util-row:hover{color:var(--accent2)}
  .util-ico{width:34px;flex:none;display:grid;place-items:center}
  .util-name{font-size:11px;letter-spacing:.04em;opacity:0;transition:opacity .1s}
  .rail.open .util-name{opacity:1}

  /* ── FLYOUT (collapsed, tap or hover) ─────────────── */
  .flyout{
    position:fixed;left:var(--rail);min-width:196px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:6px;z-index:70;
    box-shadow:0 14px 40px rgba(0,0,0,.6);display:none;
  }
  .flyout.show{display:block}
  .fly-title{font-size:9px;letter-spacing:.12em;color:var(--dim);padding:6px 10px 8px}
  .fly-item{
    display:flex;align-items:center;padding:8px 11px;border-radius:7px;
    font-size:12px;color:var(--text);cursor:pointer;transition:.1s;white-space:nowrap;
  }
  .fly-item:hover{background:rgba(200,241,53,.09);color:var(--accent)}
  .fly-item.active{color:var(--accent)}
  .fly-item .bdg{font-size:8px;color:var(--dim);margin-left:auto;letter-spacing:.04em}

  /* scrim (narrow, rail overlaid) */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
  .scrim.show{display:block}

  /* ── CONTENT ──────────────────────────────────────── */
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .crumb{
    height:52px;flex:none;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;padding:0 22px;
  }
  .crumb .dom-tag{font-size:10px;letter-spacing:.1em;color:var(--dim)}
  .crumb .sep{color:var(--dim)}
  .crumb .view-tag{font-size:13px;font-weight:700;letter-spacing:.03em}
  .crumb .spacer{flex:1}
  .crumb .hint{font-size:10px;color:var(--dim)}
  .stage{flex:1;overflow:auto;padding:40px 22px;display:grid;place-items:center}
  .ph{text-align:center;max-width:420px}
  .ph .big{width:64px;height:64px;margin:0 auto 16px;color:var(--accent);opacity:.9}
  .ph h2{margin:0 0 8px;font-size:16px;letter-spacing:.03em}
  .ph p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
  .ph code{font-family:"IBM Plex Mono",monospace;color:var(--accent2);font-size:11.5px}

  @media (max-width:640px){
    .rail.open{position:absolute;left:0;top:0;height:100%;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .stage{padding:28px 16px}
    .crumb .hint{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <nav class="rail" id="rail">
    <div class="rail-top">
      <button class="pin" id="pin" title="Pin / collapse" onclick="togglePin()" aria-label="toggle rail"></button>
      <div class="brand mono">PROJECT <span class="lime">MATRIX</span></div>
    </div>
    <div class="rail-scroll" id="railScroll"></div>
    <div class="rail-foot" id="railFoot"></div>
  </nav>

  <div class="scrim" id="scrim" onclick="togglePin()"></div>
  <div class="flyout" id="flyout"></div>

  <div class="content">
    <div class="crumb">
      <span class="dom-tag mono" id="crumbDom">TEAM</span>
      <span class="sep">›</span>
      <span class="view-tag mono" id="crumbView">Roster</span>
      <span class="spacer"></span>
      <span class="hint mono">tap an icon to jump · pin to browse</span>
    </div>
    <div class="stage">
      <div class="ph">
        <div class="big" id="stageIco"></div>
        <h2 class="mono" id="stageTitle">TEAM › Roster</h2>
        <p>The existing renderer draws here — <code id="stageFn">renderRosterTab()</code>.<br>
           Unchanged; only the navigation around it is new.</p>
      </div>
    </div>
  </div>

</div>

<script>
  /* ── icons (inline SVG, currentColor) ── */
  var I = {
    team:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c0-3 2.4-5 5.4-5s5.4 2 5.4 5"/><path d="M16 5.6a3 3 0 0 1 0 5.6"/><path d="M17.2 14c2.1.5 3.4 2.2 3.4 4.4"/></svg>',
    work:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>',
    skills:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="6.6" height="6.6" rx="1.4"/><rect x="13.4" y="4" width="6.6" height="6.6" rx="1.4"/><rect x="4" y="13.4" width="6.6" height="6.6" rx="1.4"/><rect x="13.4" y="13.4" width="6.6" height="6.6" rx="1.4"/></svg>',
    talent:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8.5"/><path d="M12 12.5C11.4 9.6 8.9 8 5.9 8c.1 3 2.5 4.9 6.1 4.5z"/><path d="M12 11.5c.5-2.6 2.7-4 5.6-4-.1 2.8-2.3 4.3-5.6 4z"/></svg>',
    insights:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="12" width="3.6" height="7.5" rx="1"/><rect x="10.2" y="6" width="3.6" height="13.5" rx="1"/><rect x="16.4" y="9" width="3.6" height="10.5" rx="1"/></svg>',
    snap:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 1.8"/></svg>',
    backup:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 4.2v8.6L12 20l-7.5-4.2V7.2z"/><path d="M4.8 7.4L12 11.5l7.2-4.1"/><path d="M12 11.5V20"/></svg>',
    ai:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2.6"/><path d="M10 3v2.4M14 3v2.4M10 18.6V21M14 18.6V21M3 10h2.4M3 14h2.4M18.6 10H21M18.6 14H21"/></svg>',
    help:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.3 2.4c-.8.3-1.3.9-1.3 1.9"/><circle cx="11.6" cy="16.6" r="0.7" fill="currentColor" stroke="none"/></svg>',
    pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    pinOpen:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    chev:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
  };

  var DOMAINS = [
    { id:'team', name:'TEAM', ico:I.team, views:[
      {id:'roster', label:'Roster', fn:'renderRosterTab()'},
      {id:'org', label:'Org chart', fn:'openOrgChart()'},
      {id:'idcard', label:'ID cards', fn:'openIdCardModal()'},
    ]},
    { id:'work', name:'WORK', ico:I.work, views:[
      {id:'matrix', label:'Portfolio matrix', bdg:'was home', fn:'renderMatrix()'},
      {id:'plan', label:'Resource plan', fn:'renderResPlan()'},
      {id:'timeline', label:'Timeline', fn:'renderTimeline()'},
      {id:'brief', label:'Project brief', fn:'openProjectBriefExport()'},
    ]},
    { id:'skills', name:'SKILLS', ico:I.skills, views:[
      {id:'skills', label:'Skills matrix', fn:'renderSkillsTab()'},
      {id:'skillrisk', label:'Skill risk', bdg:'SPOF', fn:'renderSkillRisk()'},
      {id:'heatmap', label:'Heatmap', fn:'renderHeatmap()'},
    ]},
    { id:'talent', name:'TALENT', ico:I.talent, views:[
      {id:'ninebox', label:'Nine-box', fn:'renderNineBox()'},
      {id:'disc', label:'DISC', fn:'renderDiscMatrix()'},
      {id:'profiles', label:'Profiles', fn:'renderProfilesTab()'},
      {id:'development', label:'Development', fn:'renderDevelopment()'},
      {id:'succession', label:'Succession', fn:'renderSuccession()'},
    ]},
    { id:'insights', name:'INSIGHTS', ico:I.insights, views:[
      {id:'analytics', label:'Analytics', fn:'renderAnalyticsTab()'},
      {id:'summary', label:'Summary dashboard', fn:'openSummary()'},
      {id:'cost', label:'Cost dashboard', fn:'renderResDashboard()'},
      {id:'compare', label:'Compare', fn:'openCompare()'},
    ]},
  ];
  var UTIL = [
    {ico:I.snap,name:'Snapshots'},{ico:I.backup,name:'Backup / Restore'},
    {ico:I.ai,name:'AI advisor'},{ico:I.help,name:'Help'},
  ];

  var active={dom:'team',view:'roster'}, pinned=false, flyDom=null, flyTimer=null;
  var railScroll=document.getElementById('railScroll'), railFoot=document.getElementById('railFoot');
  var flyout=document.getElementById('flyout'), rail=document.getElementById('rail'), scrim=document.getElementById('scrim');
  document.getElementById('pin').innerHTML=I.pin;

  function domById(id){return DOMAINS.find(function(d){return d.id===id;});}

  function renderRail(){
    railScroll.innerHTML=DOMAINS.map(function(d){
      var holds=d.id===active.dom, exp=pinned&&holds;
      var subs=d.views.map(function(v){
        var on=holds&&v.id===active.view;
        return '<div class="sub'+(on?' active':'')+'" onclick="go(event,\''+d.id+'\',\''+v.id+'\')">'
             + v.label+(v.bdg?'<span class="bdg">'+v.bdg+'</span>':'')+'</div>';
      }).join('');
      return '<div class="dom'+(holds?' active-dom':'')+(exp?' exp':'')+'" data-dom="'+d.id+'" onmouseenter="flyEnter(\''+d.id+'\',this)" onmouseleave="flyLeave()">'
           + '<div class="dom-head" onclick="domClick(event,\''+d.id+'\',this)">'
           +   '<span class="dom-ico">'+d.ico+'</span>'
           +   '<span class="dom-name mono">'+d.name+'</span>'
           +   '<span class="dom-chev">'+I.chev+'</span>'
           + '</div><div class="subs">'+subs+'</div></div>';
    }).join('');
    railFoot.innerHTML=UTIL.map(function(u){
      return '<div class="util-row"><span class="util-ico">'+u.ico+'</span><span class="util-name mono">'+u.name+'</span></div>';
    }).join('');
  }

  function go(ev,domId,viewId){
    if(ev)ev.stopPropagation();
    active={dom:domId,view:viewId};
    hideFly();
    if(pinned&&window.innerWidth<=640) togglePin();
    renderRail();
    var d=domById(domId), v=d.views.find(function(x){return x.id===viewId;});
    document.getElementById('crumbDom').textContent=d.name;
    document.getElementById('crumbView').textContent=v.label;
    document.getElementById('stageIco').innerHTML=d.ico.replace('width="20" height="20"','width="64" height="64"');
    document.getElementById('stageTitle').textContent=d.name+' › '+v.label;
    document.getElementById('stageFn').textContent=v.fn;
  }

  // collapsed: tap toggles flyout. pinned: tap expands accordion + goes to first view.
  function domClick(ev,domId,el){
    ev.stopPropagation();
    if(pinned){ go(ev,domId,domById(domId).views[0].id); return; }
    if(flyDom===domId){ hideFly(); } else { flyEnter(domId,el.parentElement,true); }
  }

  function togglePin(){
    pinned=!pinned;
    rail.classList.toggle('open',pinned);
    document.getElementById('pin').innerHTML=pinned?I.pinOpen:I.pin;
    scrim.classList.toggle('show',pinned&&window.innerWidth<=640);
    hideFly(); renderRail();
  }

  /* flyout */
  function flyEnter(domId,el,fromTap){
    if(pinned) return;
    clearTimeout(flyTimer); flyDom=domId;
    var d=domById(domId), rect=el.getBoundingClientRect();
    flyout.innerHTML='<div class="fly-title mono">'+d.name+'</div>'+d.views.map(function(v){
      var on=domId===active.dom&&v.id===active.view;
      return '<div class="fly-item'+(on?' active':'')+'" onclick="go(event,\''+domId+'\',\''+v.id+'\')">'
           + '<span>'+v.label+'</span>'+(v.bdg?'<span class="bdg">'+v.bdg+'</span>':'')+'</div>';
    }).join('');
    flyout.style.top=Math.max(8,Math.min(rect.top,window.innerHeight-((d.views.length+1)*38+20)))+'px';
    flyout.classList.add('show');
  }
  function flyLeave(){ flyTimer=setTimeout(hideFly,200); }
  function hideFly(){ flyout.classList.remove('show'); flyDom=null; }
  flyout.addEventListener('mouseenter',function(){clearTimeout(flyTimer);});
  flyout.addEventListener('mouseleave',hideFly);
  document.addEventListener('click',function(e){
    if(!rail.contains(e.target)&&!flyout.contains(e.target)) hideFly();
  });

  go(null,'team','roster');
  renderRail();
</script>
</body>
</html>
